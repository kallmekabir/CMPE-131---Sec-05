# Render Blueprint: API + Postgres. The frontend is deployed separately on Vercel (see docs/DEPLOY.md).
services:
  - type: web
    name: spartin-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    preDeployCommand: npx prisma migrate deploy
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_PROVIDER
        value: local
      - key: DATABASE_URL
        fromDatabase:
          name: spartin-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: AUTH_RATE_LIMIT_MAX
        value: "30"
      - key: CORS_ORIGINS
        sync: false # your Vercel URL, e.g. https://spartin.vercel.app
      - key: PUBLIC_APP_URL
        sync: false # same Vercel URL
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false

databases:
  - name: spartin-db
    plan: free
