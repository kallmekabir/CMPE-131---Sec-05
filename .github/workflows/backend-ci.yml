name: Backend CI

on:
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-ci.yml']
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend-ci.yml']

defaults:
  run:
    working-directory: backend

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spartin
          POSTGRES_PASSWORD: spartin_ci
          POSTGRES_DB: spartin_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U spartin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://spartin:spartin_ci@localhost:5433/spartin_test
      TEST_DATABASE_URL: postgresql://spartin:spartin_ci@localhost:5433/spartin_test
      JWT_ACCESS_SECRET: ci-only-access-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npx prisma migrate deploy
      - run: npm run test:coverage
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
